<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script>
      (function () {
        if (localStorage.getItem("token")) {
          window.location.replace("index.html");
        }
      })();
    </script>
    <title>Sign Up - Balance Sheet</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .card-box {
        background: #ffffff;
        padding: 36px 32px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 420px;
      }
      h2 {
        text-align: center;
        margin-bottom: 24px;
        font-weight: 700;
        color: #2d3748;
      }
      .form-control {
        padding: 10px 14px;
        border: 1.5px solid #cbd5e0;
        border-radius: 8px;
      }
      .form-control:focus {
        border-color: #4c51bf;
        box-shadow: 0 0 0 3px rgba(76, 81, 191, 0.15);
      }
      .btn-primary {
        background: #4c51bf;
        border: none;
        padding: 10px;
        border-radius: 8px;
        font-weight: 600;
        width: 100%;
        margin-top: 10px;
        transition: all 0.2s;
      }
      .btn-primary:hover {
        background: #434190;
      }
      .auth-link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #718096;
      }
      .auth-link a {
        color: #4c51bf;
        text-decoration: none;
        font-weight: 600;
      }
      .auth-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card-box">
      <h2>Create Account</h2>
      <form id="signupForm">
        <div class="mb-3">
          <label class="form-label text-secondary fs-6">Username</label>
          <input
            type="text"
            class="form-control"
            id="user_name"
            required
            placeholder="John Doe"
          />
        </div>
        <div class="mb-3">
          <label class="form-label text-secondary fs-6">Email Address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            required
            placeholder="name@example.com"
          />
        </div>
        <div class="mb-4">
          <label class="form-label text-secondary fs-6">Password</label>
          <input
            type="password"
            class="form-control"
            id="pass"
            required
            placeholder="••••••••"
          />
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>
      <div class="auth-link">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/signup.js"></script>
</html>
